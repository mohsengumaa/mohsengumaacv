  <main>
    <h2>اتصل بي</h2>
    <form action="#" method="post">
      <fieldset>
        <legend>بيانات التواصل</legend>
        <p>
          <label for="name">الاسم</label><br />
          <input id="name" name="name" type="text" placeholder="اكتب اسمك الكامل" autocomplete="name" required />
        </p>

        <p>
          <label for="email">البريد الإلكتروني</label><br />
          <input id="email" name="email" type="email" placeholder="name@example.com" autocomplete="email" required />
        </p>

        <p>
          <label for="subject">الموضوع</label><br />
          <input id="subject" name="subject" type="text" placeholder="عنوان الرسالة" required />
        </p>

        <p>
          <label for="message">رسالة نصية</label><br />
          <textarea id="message" name="message" placeholder="اكتب رسالتك هنا" rows="6" required></textarea>
        </p>
      </fieldset>

      <p>
        <button type="submit">إرسال الرسالة</button>
      </p>
      <p>سأقوم بالرد بأقرب وقت ممكن.</p>
    </form>
  </main>
